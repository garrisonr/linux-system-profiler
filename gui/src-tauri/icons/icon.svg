       Full-bleed rounded tile (r=89, same ratio as the Fable anchor),
       Bondi-blue gradient tint, ONE bold flat white glyph: a gauge
       (arc band + needle + hub) drawn as a single silhouette.
       Original artwork; geometry matches make_icon.py in the project records. -->
  <defs>
