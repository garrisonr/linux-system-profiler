      <stop offset="0" stop-color="#1D7FA6"/>
      <stop offset="1" stop-color="#3AADD2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="89" fill="url(#g)"/>
  <g fill="#ffffff">
    <path d="M 120.1 319.4 A 150 150 0 1 1 391.9 319.4 L 348.4 299.1 A 102 102 0 1 0 163.6 299.1 Z"/>
