[package]
name = "linux-system-profiler-gui"
version = "0.8.3"
edition = "2021"
license = "MIT"
description = "Linux System Profiler — Tauri GUI (Apple design language, adaptive layouts)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
linux-system-profiler = { path = "../.." }
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.15"
