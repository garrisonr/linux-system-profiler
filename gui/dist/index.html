<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Profiler</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
<script>try{var t=localStorage.getItem("lsp-theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="machine-name" id="machineName">This Computer</div>
      <div class="machine-sub" id="machineSub">Gathering profile…</div>
    </div>
    <nav class="tree" id="tree" aria-label="Profile sections">
      <div class="skel-row"><span class="skel-bar w55"></span></div>
      <div class="skel-row"><span class="skel-bar w40"></span></div>
      <div class="skel-row"><span class="skel-bar w70"></span></div>
      <div class="skel-row"><span class="skel-bar w40"></span></div>
      <div class="skel-row"><span class="skel-bar w55"></span></div>
      <div class="skel-row"><span class="skel-bar w70"></span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="dropdown" id="themeDropdown">
        <button type="button" class="dropdown-btn" id="themeBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme">
          <span class="dropdown-label" id="themeLabel">Auto (this system)</span>
          <span class="dropdown-chev" aria-hidden="true">⌄</span>
        </button>
        <div class="dropdown-pop hidden" id="themePop" role="listbox" aria-label="Theme"></div>
      </div>
      <button class="pill secondary" id="refreshBtn" type="button">Refresh</button>
      <button class="pill secondary" id="exportBtn" type="button">Copy &amp; Share</button>
    </div>
  </aside>

  <main class="detail">
    <div class="banner hidden" id="depBanner" role="alert">
      <div class="banner-text" id="depBannerText"></div>
      <div class="banner-actions" id="depBannerActions">
        <button class="pill primary" id="depInstallBtn" type="button">Install missing tools</button>
      </div>
    </div>
    <header class="detail-head">
      <button class="pill secondary back-btn" id="backBtn" type="button">‹ Sections</button>
      <h1 id="detailTitle">Overview</h1>
      <div class="detail-sub" id="detailSub"></div>
    </header>
    <section class="detail-body" id="detailBody" aria-busy="true">
      <p class="load-stage" role="status"><span class="load-dot" aria-hidden="true"></span><span>Gathering profile — <span id="loadStage">starting…</span></span></p>
      <div class="skel-card"><span class="skel-bar w40"></span><span class="skel-bar w70"></span><span class="skel-bar w55"></span></div>
      <div class="skel-card"><span class="skel-bar w40"></span><span class="skel-bar w70"></span></div>
      <div class="skel-card"><span class="skel-bar w55"></span><span class="skel-bar w70"></span><span class="skel-bar w40"></span></div>
      <div class="skel-card"><span class="skel-bar w40"></span><span class="skel-bar w55"></span></div>
      <div class="skel-card"><span class="skel-bar w70"></span><span class="skel-bar w40"></span></div>
    </section>
  </main>

  <aside class="rail" id="healthRail">
    <h2 id="railTitle">Health</h2>
    <div id="railBody"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="gloss-card hidden" id="glossCard" role="dialog" aria-label="Term explanation"></div>

<dialog class="sheet" id="shareSheet">
  <div class="sheet-head"><h2>Copy &amp; Share</h2>
  <button class="pill secondary" id="shareClose" type="button">Done</button></div>
  <div class="share-list">
    <button type="button" class="share-opt" data-share="copy:sanitized"><strong>Copy sanitized report</strong><span>Markdown, safe for forums — serials, MACs, usernames stripped</span></button>
    <button type="button" class="share-opt" data-share="copy:full-md"><strong>Copy full report</strong><span>Markdown with everything, for your own notes</span></button>
    <button type="button" class="share-opt" data-share="copy:json"><strong>Copy profile JSON</strong><span>The complete machine-readable profile</span></button>
    <button type="button" class="share-opt" data-share="save:sanitized"><strong>Save sanitized report…</strong><span>Markdown file, forum-safe</span></button>
    <button type="button" class="share-opt" data-share="save:json"><strong>Save profile JSON…</strong><span>Full profile as a file</span></button>
    <button type="button" class="share-opt" data-share="email:x"><strong>Email summary…</strong><span>Opens your mail client with the highlights</span></button>
  </div>
</dialog>

<dialog class="sheet" id="exportSheet">
  <div class="sheet-head"><h2>Share — manual copy</h2>
  <button class="pill secondary" id="exportClose" type="button">Done</button></div>
  <p class="empty">The clipboard was not reachable, so here is the sanitized report — select it and copy manually.</p>
  <textarea class="export-text" id="exportText" readonly rows="14"></textarea>
  <div class="row"><button class="pill primary" id="exportSelect" type="button">Select all</button></div>
</dialog>

<dialog class="sheet" id="logSheet">
  <div class="sheet-head"><h2 id="logTitle">Log</h2>
  <span><button class="pill secondary" id="logCopy" type="button">Copy output</button>
  <button class="pill secondary" id="logClose" type="button">Close</button></span></div>
  <p class="detail-sub" id="logStatus"></p>
  <div class="vizsla-wait" id="logVizsla" hidden aria-hidden="true">
    <svg viewBox="0 0 240 72" role="presentation">
      <line x1="4" y1="64" x2="236" y2="64" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
      <g class="viz-run" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 40 q-6 -12 2 -20 q3 8 8 10"/>
        <path d="M24 34 q14 -8 34 -6 q20 2 30 12 l6 2 q4 1 3 5 q-1 3 -6 3 l-10 -1 q-4 8 -12 12 l-2 6 M40 46 l-4 12 M74 48 l6 10 M86 44 l10 8"/>
        <path d="M28 30 q-14 -4 -20 -14 q12 -2 18 4 q4 4 2 10"/>
        <circle cx="24" cy="22" r="1.6" fill="currentColor" stroke="none"/>
      </g>
      <circle class="viz-ball" cx="150" cy="58" r="6" fill="var(--accent)"/>
    </svg>
  </div>
  <pre class="log" id="logBody"></pre>
</dialog>

<dialog class="sheet" id="confirmSheet">
  <div class="sheet-head"><h2 id="confirmTitle">Update</h2></div>
  <p id="confirmBody"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="pill secondary" id="confirmCancel" type="button">Cancel</button>
    <button class="pill primary" id="confirmOk" type="button">Update now</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
